name: Node CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js 22.x
        # Must match the runtime declared in companion/manifest.json
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Prepare Environment
        run: |
          corepack enable
      - name: Prepare module
        run: |
          yarn install
        env:
          CI: true
      - name: Check types
        run: |
          yarn typecheck
        env:
          CI: true
      - name: Run lint
        run: |
          yarn lint
        env:
          CI: true
      - name: Check formatting
        run: |
          yarn format:check
        env:
          CI: true
      - name: Build and run tests
        run: |
          yarn test
        env:
          CI: true
